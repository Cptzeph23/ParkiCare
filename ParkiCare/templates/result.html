{% extends "base.html" %}
{% block content %}
    <h2 class="hc-title">Prediction Result</h2>
    <p class="hc-sub"><strong>{{ result }}</strong></p>
    <h3 class="hc-title">Entered Values</h3>
    <ul class="hc-list">
        {% for name, value in values %}
          <li>{{ name }} : {{ value }}</li>
        {% endfor %}
    </ul>
    <div class="hc-actions">
        <a class="hc-btn alt" href="/predict/">Run Another Test</a>
    </div>
{% endblock %}
