{% extends "base.html" %}
{% block content %}
    <h2 class="hc-title">Parkinson’s Disease Screening</h2>
    {% if error %}
        <div class="hc-error">{{ error }}</div>
    {% endif %}
    <form class="hc-form" method="post">
        {% csrf_token %}
        <div class="hc-grid hc-full">
        {% for feature in features %}
            <div class="hc-field">
                <label class="hc-label">{{ feature }}</label>
                <input class="hc-input hc-number" type="number" step="any" name="{{ feature }}" placeholder="Enter value" required>
            </div>
        {% endfor %}
        </div>
        <div class="hc-actions">
            <button class="hc-btn" type="submit">Predict</button>
        </div>
    </form>
{% endblock %}
